		<script>
			const modalPesquisaOverlay = document.getElementById(
				"modalPesquisaOverlay"
			);
			const closeModalPesquisa = document.getElementById("closeModalPesquisa");

			// Abrir modal automaticamente ao carregar a página
			document.addEventListener("DOMContentLoaded", () => {
				modalPesquisaOverlay.style.display = "flex";
			});

			// Fechar modal ao clicar no X
			closeModalPesquisa.addEventListener("click", () => {
				modalPesquisaOverlay.style.display = "none";
			});

			// Fechar modal ao clicar fora
			modalPesquisaOverlay.addEventListener("click", (e) => {
				if (e.target === modalPesquisaOverlay) {
					modalPesquisaOverlay.style.display = "none";
				}
			});
		</script>
