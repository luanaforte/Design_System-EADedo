<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			:root {
				/* Gradients */
				--Midnight: linear-gradient(90deg, #1529ff 0%, #151720 100%);
				--Ash: linear-gradient(90deg, #a6abc5 0%, #151720 100%);
				--Smoke: linear-gradient(
					180deg,
					rgba(0, 0, 0, 0) 0%,
					rgba(0, 0, 0, 0.8) 100%
				);
			}

			/* Animação de rotação suave */
			@property --bg-angle {
				inherits: false;
				initial-value: 0deg;
				syntax: "<angle>";
			}

			@keyframes spin {
				to {
					--bg-angle: 360deg;
				}
			}

			/* Botão base */
			.button-rounded-gradient {
				height: 2.5rem;
				min-width: 11.5625rem;
				max-width: fit-content;
				padding: 0rem var(--space-100);
				text-decoration: none;
				display: flex;
				align-items: center;
				border-radius: var(--radius-medium);
				/* borda do botao  */
				animation: spin 2.5s infinite linear paused;
				background: linear-gradient(#f0f1f5, #f0f1f5) padding-box,
					var(--Midnight) border-box; /* usa o novo gradiente */
				border: 1px solid transparent;
				transition: all 0.3s ease;
			}

			/* Efeito hover */
			.button-rounded-gradient:hover {
				animation: spin 1.75s infinite linear;
				background: linear-gradient(#f0f1f5, #f0f1f5) padding-box,
					conic-gradient(
							from var(--bg-angle) at center,
							#1529ff,
							#151720,
							#a6abc5,
							#1529ff
						)
						border-box;
				border: 1px solid transparent;
				animation-play-state: running;
			}

			/* Texto gradient */
			.button-rounded-gradient-nome {
				font-family: Poppins, sans-serif;
				font-size: 1rem;
				font-weight: 500;
				background: var(--Ash);
				background-clip: text;
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				margin: 0;
			}
		</style>
	</head>
	<body>
		<div>
			<a href="" class="button-rounded-gradient">
				<p class="button-rounded-gradient-nome">Fale comigo</p>
				<svg
					width="24"
					height="25"
					viewBox="0 0 24 25"
					fill="none"
					xmlns="http://www.w3.org/2000/svg">

						fill="#151720"></path>

	></body>
</html>
