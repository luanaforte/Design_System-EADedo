<!doctype html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Componente de Busca - EaDedo</title>
	<link rel="stylesheet" href="../../fundamentals/index.css" />
</head>

<body>
	<div class="container-md Secretaria">
		<div class="Search_Box" id="main-search">
			<div class="Search_Box__input-wrapper" onclick="toggleSearch(true, event)">
				<input type="text" class="Search_Box__input" placeholder="Pesquise na Secretaria Virtual" readonly />
				<button class="Search_Box__icon-btn">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
						<path
							d="M21.5306 20.4693L16.8366 15.7762C18.1971 14.1428 18.8755 12.0478 18.7307 9.92691C18.5859 7.80604 17.629 5.82265 16.0591 4.38932C14.4892 2.95599 12.4272 2.18308 10.3019 2.23138C8.17666 2.27968 6.15184 3.14547 4.64867 4.64864C3.1455 6.15181 2.27971 8.17663 2.23141 10.3019C2.18311 12.4271 2.95602 14.4892 4.38935 16.0591C5.82268 17.629 7.80607 18.5859 9.92734 18.7307C12.0478 18.8755 14.1429 18.1971 15.7763 16.8365L20.4694 21.5306C20.5391 21.6003 20.6218 21.6556 20.7128 21.6933C20.8039 21.731 20.9015 21.7504 21 21.7504C21.0985 21.7504 21.1961 21.731 21.2872 21.6933C21.3782 21.6556 21.4609 21.6003 21.5306 21.5306C21.6003 21.4609 21.6556 21.3782 21.6934 21.2872C21.7311 21.1961 21.7505 21.0985 21.7505 21C21.7505 20.9015 21.7311 20.8039 21.6934 20.7128C21.6556 20.6218 21.6003 20.539 21.5306 20.4693ZM10.5 17.25C9.16515 17.25 7.86019 16.8541 6.75005 16.1124C5.63991 15.3708 4.77341 14.3159 4.26322 13.0818C3.75304 11.8477 3.61962 10.4897 3.88005 9.17983C4.14049 7.86995 4.78306 6.66668 5.72621 5.72353C6.66935 4.78039 7.87262 4.13781 9.1825 3.87738C10.4924 3.61695 11.8504 3.75037 13.0845 4.26055C14.3186 4.77073 15.3735 5.63724 16.1152 6.74738C16.8568 7.85752 17.2527 9.16248 17.2527 10.4973C17.2514 12.287 16.54 14.0031 15.2745 15.2687C14.009 16.5342 12.2928 17.2486 10.5032 17.25H10.5Z"
							fill="currentColor" />
					</svg>
				</button>
			</div>

			<div class="Search_Box__dropdown">
				<div class="Search_Box__header-expanded">
					<input type="text" id="search-input-field" class="Search_Box__input"
						placeholder="O que você procura?" oninput="handleSearch(this)" />
					<button class="Search_Box__icon-btn" onclick="toggleSearch(false)">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
							<path
								d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"
								fill="currentColor" />
						</svg>
					</button>
				</div>
				<div class="Search_Box__separator"></div>
				<ul class="Search_Box__suggestions-list" id="suggestions-list">
					<li class="list-item">
						<button class="Search_Box__suggestion-btn" onclick="scrollToSection('Rotulo_percursos')">
							<p class="paragraph--medium">Percursos de Aprendizagem</p>
						</button>
					</li>
					<li class="list-item">
						<button class="Search_Box__suggestion-btn"
							onclick="scrollToSection('Rotulo_encontro-academico')">
							<p class="paragraph--medium">Encontro Acadêmico</p>
						</button>
					</li>
					<li class="list-item">
						<button class="Search_Box__suggestion-btn" onclick="scrollToSection('Rotulo_orientacao')">
							<p class="paragraph--medium">Orientação</p>
						</button>
					</li>
				</ul>
			</div>
		</div>
	</div>

	<script>
		const initSearch = () => {
			const searchBox = document.getElementById("main-search");
			const inputField = document.getElementById("search-input-field");
			const list = document.getElementById("suggestions-list");

			if (!searchBox || !inputField || !list) return;


			if (searchBox.dataset.searchInitialized) return;
			searchBox.dataset.searchInitialized = "true";

			const defaultSuggestionsHTML = list.innerHTML;

			window.toggleSearch = (expand, event) => {

				if (event) {
					event.stopPropagation();
				}

				const currentSearchBox = document.getElementById("main-search");
				if (!currentSearchBox) return;

				currentSearchBox.classList.toggle("Search_Box--expanded", expand);
				if (expand) {
					const currentInputField = document.getElementById("search-input-field");
					if (currentInputField) {
						setTimeout(() => currentInputField.focus(), 50);
					}
				}
			};

			window.handleSearch = (e) => {
				const term = e.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

				const currentList = document.getElementById("suggestions-list");
				if (!currentList) return;

				if (!term) {
					currentList.innerHTML = defaultSuggestionsHTML;
					return;
				}

				const containers = document.querySelectorAll(".SessaoTitulo, section, .activity, .block, .card");

				const itemsFound = Array.from(containers)
					.filter(s => {
						const content = s.innerText.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
						return content.includes(term);
					})
					.map(s => {
						const titleEl = s.querySelector("h1, h2, h3, h4, .heading3, .heading2");
						return {
							title: titleEl?.textContent.trim(),
							id: s.id || titleEl?.id
						};
					})
					.filter(i => i.title && i.id);

				const uniqueItems = Array.from(new Map(itemsFound.map(item => [item.id, item])).values());

				if (uniqueItems.length > 0) {
					currentList.innerHTML = uniqueItems.map(item => `
        <li class="list-item">
          <button class="Search_Box__suggestion-btn" onclick="scrollToSection('${item.id}')">
            <p class="paragraph--medium">${item.title}</p>
          </button>
        </li>`).join("");
				} else {
					currentList.innerHTML = `
        <div class="Search_Box__no-results">
          <p class="paragraph--medium">Não foi possível encontrar uma correspondência, tente novamente.</p>
        </div>`;
				}
			};

			window.scrollToSection = (id) => {
				const element = document.getElementById(id);
				if (element) {
					const headerOffset = 100;
					const elementPosition = element.getBoundingClientRect().top;
					const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

					window.scrollTo({
						top: offsetPosition,
						behavior: "smooth"
					});
					window.toggleSearch(false);
				}
			};


			if (!window.searchGlobalListenerAdded) {
				document.addEventListener("click", (e) => {
					const activeSearchBox = document.querySelector(".Search_Box--expanded");
					if (activeSearchBox && !activeSearchBox.contains(e.target)) {
						window.toggleSearch(false);
					}
				});
				window.searchGlobalListenerAdded = true;
			}
		};

		if (document.readyState === "loading") {
			document.addEventListener("DOMContentLoaded", initSearch);
		} else {
			initSearch();
		}

	</script>

</body>

</html>
