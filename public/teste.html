<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Minha Página</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/design_system2@1.0.2/dist/eadedo_style.min.css" />
	</head>
	<body>
		<main class="AmbienteDaTutoria">
			<div class="flexbox__center margin__bottom--default">
				<div class="avatar avatar__letter--lg background-blue-600">
					<span class="avatar__letter-content--lg">A</span>
				</div>
				<div class="avatar avatar__letter--md background-blue-600">
					<span class="avatar__letter-content--md">A</span>
				</div>
				<div class="avatar avatar__letter--sm background-blue-600">
					<span class="avatar__letter-content--sm">A</span>
				</div>
			</div>
			<div class="flexbox__center margin__bottom--default">
				<div class="avatar avatar__letter--lg background-blue-300">
					<span class="avatar__letter-content--additional-lg">+4</span>
				</div>
				<div class="avatar avatar__letter--md background-blue-300">
					<span class="avatar__letter-content--additional-md">+4</span>
				</div>
				<div class="avatar avatar__letter--sm background-blue-300">
					<span class="avatar__letter-content--additional-sm">+4</span>
				</div>
			</div>
			<div class="flexbox__center margin__bottom--default">
				<div class="avatar">
					<img
						src="{Profile}"
						alt="inserir a alto descrição da pessoa"
						class="avatar__image--lg" />
				</div>
				<div class="avatar">
					<img
						src="{Profile}"
						alt="inserir a alto descrição da pessoa"
						class="avatar__image--md" />
				</div>
				<div class="avatar">
					<img
						src="{Profile}"
						alt="inserir a alto descrição da pessoa"
						class="avatar__image--sm" />
				</div>
			</div>
			<div class="avatar-group margin__bottom--default">
				<div class="avatar avatar__letter--lg background-blue-900">
					<span class="avatar__letter-content--lg">A</span>
				</div>
				<div class="avatar avatar__letter--lg background-blue-600">
					<span class="avatar__letter-content--lg">B</span>
				</div>
				<div class="avatar avatar__letter--lg background-blue-300">
					<span class="avatar__letter-content--additional-lg">+4</span>
				</div>
			</div>
			<div class="avatar-group margin__bottom--default">
				<div class="avatar avatar__letter--lg background-blue-900">
					<span class="avatar__letter-content--lg">A</span>
				</div>
				<div class="avatar avatar__letter--lg background-blue-600">
					<span class="avatar__letter-content--lg">B</span>
				</div>
			</div>
			<div class="avatar-group--sm margin__bottom--default">
				<div class="avatar avatar__letter--sm background-blue-900">
					<span class="avatar__letter-content--sm">A</span>
				</div>
				<div class="avatar avatar__letter--sm background-blue-600">
					<span class="avatar__letter-content--sm">B</span>
				</div>
				<div class="avatar avatar__letter--sm background-blue-300">
					<span class="avatar__letter-content--additional-sm">+4</span>
				</div>
			</div>
			<div class="avatar-group--sm margin__bottom--default">
				<div class="avatar avatar__letter--sm background-blue-900">
					<span class="avatar__letter-content--sm">A</span>
				</div>
				<div class="avatar avatar__letter--sm background-blue-600">
					<span class="avatar__letter-content--sm">B</span>
				</div>
			</div>
			<div class="avatar__tagline margin__bottom--default">
				<img
					src="{Profile}"
					alt="Foto do perfil do usuário"
					class="avatar__image--lg" />
				<div class="avatar__info">
					<p class="avatar__name">Nome do Usuário</p>
				</div>
			</div>
			<div class="avatar__tagline margin__bottom--default">
				<img
					src="{Profile}"
					alt="Foto do perfil do usuário"
					class="avatar__image--lg" />
				<div class="avatar__info">
					<p class="avatar__name">Nome do Usuário</p>
					<p class="avatar__tagline-text">Tagline</p>
				</div>
			</div>
		</main>
		<script src="https://cdn.jsdelivr.net/npm/design_system2@1.0.3/dist/Style_moodle.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/design_system2@1.0.3/dist/eadedo_style.min.css"></script>
	</body>
</html>
